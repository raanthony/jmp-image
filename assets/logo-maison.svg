<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 230">
  <!-- Official Fiangonana Jesosy Mpamonjy emblem (from flyer) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Gold cross -->
    <path d="M100 6 V36 M86 16 H114" fill="none" stroke="#E08A1A" stroke-width="8"/>

    <!-- Navy house outline (open bottom onto book) -->
    <path d="M40 82 L100 26 L160 82 V122" fill="none" stroke="#071A36" stroke-width="8"/>
    <path d="M40 82 V122" fill="none" stroke="#071A36" stroke-width="8"/>

    <!-- Three worshiping figures -->
    <g fill="#071A36" stroke="none">
      <!-- left adult: head + raised-arm body silhouette -->
      <circle cx="66" cy="90" r="9.5"/>
      <path d="M48 78
               C52 88 56 96 60 102
               L54 124 H78 L74 106
               C78 100 84 92 90 82
               C82 90 76 96 70 100
               C68 96 64 90 66 90
               C62 94 56 88 48 78 Z"/>

      <!-- center child -->
      <circle cx="100" cy="100" r="8"/>
      <path d="M86 92
               C90 98 93 104 95 108
               L90 126 H110 L105 110
               C107 104 110 98 114 92
               C108 98 104 102 100 104
               C96 102 92 98 86 92 Z"/>

      <!-- right adult -->
      <circle cx="134" cy="90" r="9.5"/>
      <path d="M152 78
               C148 88 144 96 140 102
               L146 124 H122 L126 106
               C122 100 116 92 110 82
               C118 90 124 96 130 100
               C132 96 136 90 134 90
               C138 94 144 88 152 78 Z"/>
    </g>

    <!-- Open Bible — navy page curves -->
    <g fill="none" stroke="#071A36" stroke-width="5.5">
      <path d="M36 130 C62 118 84 118 100 128 C116 118 138 118 164 130"/>
      <path d="M32 142 C60 128 84 128 100 138 C116 128 140 128 168 142"/>
      <path d="M28 154 C58 138 84 138 100 148 C116 138 142 138 172 154"/>
    </g>
    <!-- Gold bottom cover -->
    <path d="M24 166 C56 148 84 148 100 158 C116 148 144 148 176 166"
          fill="none" stroke="#E08A1A" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
